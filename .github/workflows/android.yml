name: Android build and runtime checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Materialize verified source bundle (one time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -f bootstrap.1 ] && [ -f bootstrap.2 ]; then
            python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          raw = Path('bootstrap.1').read_bytes() + Path('bootstrap.2').read_bytes()
          expected = '4ead11c898b4c388008f02e44dac67b2805c35fa0891bbdf58228110db42e7c9'
          assert hashlib.sha256(raw).hexdigest() == expected, 'Source checksum mismatch'
          decoder = lzma.LZMADecompressor()
          data = decoder.decompress(raw, max_length=2000001)
          assert decoder.eof and not decoder.unused_data and len(data) <= 2000000
          files = json.loads(data)
          assert isinstance(files, dict) and 0 < len(files) <= 50
          root = Path.cwd().resolve()
          for name, content in files.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert '.github' not in relative.parts and '.git' not in relative.parts
              assert isinstance(content, str) and len(content) <= 200000
              destination = root.joinpath(*relative.parts).resolve()
              assert root in destination.parents
          for name, content in files.items():
              destination = root.joinpath(*PurePosixPath(name).parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding='utf-8')
          print('Verified and materialized', len(files), 'source files')
          PY
            gradle --no-daemon wrapper --gradle-version 8.14.3 --distribution-type bin
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .gitignore README.md app docs tools settings.gradle.kts build.gradle.kts gradle.properties gradlew gradlew.bat gradle/wrapper
            git rm bootstrap.1 bootstrap.2
            git commit -m 'feat: implement offline Android Screenshot Inbox'
            git push origin HEAD:main
          fi
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK cannot access the Internet
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee app/build/apk-permissions.txt
          if grep -q 'android.permission.INTERNET' app/build/apk-permissions.txt; then
            echo 'Unexpected INTERNET permission'; exit 1
          fi
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Inbox-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 runtime, OCR and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/app.captureinbox/files/screenshots app/build/runtime-screenshots || true
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Inbox-validation
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/runtime-screenshots
            app/build/apk-permissions.txt
