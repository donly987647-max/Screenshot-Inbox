name: Android build and runtime checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Package exact source
        run: git archive --format=zip --prefix=Screenshot-Inbox/ --output=Screenshot-Inbox-source-v0.1.0.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Inbox-source-v0.1.0
          path: Screenshot-Inbox-source-v0.1.0.zip
          if-no-files-found: error
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK cannot access the Internet
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee app/build/apk-permissions.txt
          if grep -q 'android.permission.INTERNET' app/build/apk-permissions.txt; then
            echo 'Unexpected INTERNET permission'; exit 1
          fi
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Inbox-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 runtime, OCR and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -c 'set +e; gradle --no-daemon connectedDebugAndroidTest; status=$?; adb pull /sdcard/Android/data/app.captureinbox/files/screenshots app/build/runtime-screenshots || true; exit $status'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Inbox-validation
          path: |
            app/build/reports
            app/build/outputs/androidTest-results
            app/build/runtime-screenshots
            app/build/apk-permissions.txt
